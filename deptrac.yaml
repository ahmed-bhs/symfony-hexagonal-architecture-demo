deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*test.*#i'

  layers:
    # ================================================================================
    # SHARED MODULE - Cross-cutting concerns
    # ================================================================================

    # Shared Domain - Pure DDD concepts (AggregateRoot, DomainEvent, etc.)
    - name: SharedDomain
      collectors:
        - type: classLike
          value: App\\Shared\\Domain\\.*

    # Shared Pagination Domain - Pagination value objects
    - name: SharedPaginationDomain
      collectors:
        - type: classLike
          value: App\\Shared\\Pagination\\Domain\\.*

    # Shared Search Domain - Search value objects
    - name: SharedSearchDomain
      collectors:
        - type: classLike
          value: App\\Shared\\Search\\Domain\\.*

    # Shared Infrastructure Adapter Out - Technical adapters (EventPublisher, Generator, etc.)
    - name: SharedAdapterOut
      collectors:
        - type: classLike
          value: App\\Shared\\Infrastructure\\Adapter\\Out\\.*

    # ================================================================================
    # BOUNDED CONTEXTS - Hexagonal Architecture Layers
    # ================================================================================

    # Domain Port IN (Primary/Driving) - Use Case Interfaces
    - name: DomainPortIn
      collectors:
        - type: classLike
          value: App\\Gift\\.*\\Domain\\Port\\In\\.*
        - type: classLike
          value: App\\Security\\.*\\Domain\\Port\\In\\.*

    # Domain Port OUT (Secondary/Driven) - Repository Interfaces, External Service Interfaces
    - name: DomainPortOut
      collectors:
        - type: classLike
          value: App\\Gift\\.*\\Domain\\Port\\Out\\.*
        - type: classLike
          value: App\\Security\\.*\\Domain\\Port\\Out\\.*

    # Domain Core - Models, ValueObjects, Events (no ports)
    - name: DomainCore
      collectors:
        - type: classLike
          value: App\\Gift\\.*\\Domain\\Model\\.*
        - type: classLike
          value: App\\Gift\\.*\\Domain\\ValueObject\\.*
        - type: classLike
          value: App\\Gift\\.*\\Domain\\Event\\.*
        - type: classLike
          value: App\\Security\\.*\\Domain\\Model\\.*
        - type: classLike
          value: App\\Security\\.*\\Domain\\ValueObject\\.*
        - type: classLike
          value: App\\Security\\.*\\Domain\\Event\\.*

    # Application Layer - Commands, Queries, Handlers, DTOs, Services
    - name: Application
      collectors:
        - type: classLike
          value: App\\Gift\\.*\\Application\\.*
        - type: classLike
          value: App\\Security\\.*\\Application\\.*

    # Adapter IN (Driving) - Controllers, CLI, Consumers
    - name: AdapterIn
      collectors:
        - type: classLike
          value: App\\Gift\\.*\\Infrastructure\\Adapter\\In\\.*
        - type: classLike
          value: App\\Security\\.*\\Infrastructure\\Adapter\\In\\.*

    # Adapter OUT (Driven) - Repositories, External Services, Event Subscribers
    - name: AdapterOut
      collectors:
        - type: classLike
          value: App\\Gift\\.*\\Infrastructure\\Adapter\\Out\\.*
        - type: classLike
          value: App\\Security\\.*\\Infrastructure\\Adapter\\Out\\.*

    # Symfony Framework (Global controllers, DataFixtures, Kernel)
    - name: Symfony
      collectors:
        - type: classLike
          value: App\\Controller\\.*
        - type: classLike
          value: App\\DataFixtures\\.*
        - type: classLike
          value: App\\Kernel

  ruleset:
    # ================================================================================
    # HEXAGONAL ARCHITECTURE - DEPENDENCY RULES
    # ================================================================================
    #
    # ARCHITECTURE OVERVIEW:
    #
    #                     ┌─────────────────────────────────┐
    #                     │           DOMAIN                │
    #    DRIVING          │  ┌───────────────────────────┐  │         DRIVEN
    #    (IN)             │  │    Models, ValueObjects   │  │         (OUT)
    #                     │  │    Events, Services       │  │
    # ┌──────────┐        │  └───────────────────────────┘  │        ┌──────────┐
    # │Controller│───────►│  Port IN      Port OUT         │───────►│  DB      │
    # │  CLI     │        │  (UseCase)    (Repository)     │        │  API     │
    # │  Queue   │        │                                │        │  Email   │
    # └──────────┘        └─────────────────────────────────┘        └──────────┘
    #  Adapter IN                                                    Adapter OUT
    #
    # ================================================================================

    # SHARED LAYERS - Foundation
    SharedDomain: []                    # Pure DDD - depends on nothing
    SharedPaginationDomain: []          # Value objects - depends on nothing
    SharedSearchDomain: []              # Value objects - depends on nothing

    SharedAdapterOut:                   # Technical adapters
      - SharedDomain                    # Implements shared domain ports
      - DomainPortOut                   # Validators use domain repository ports
      - DomainCore                      # Validators use domain VOs

    # DOMAIN LAYER - The Core
    DomainPortIn:                        # Use case interfaces
      - Application                      # Port IN references Commands/Queries (Application DTOs)
      - DomainCore                       # Port IN can reference Domain VOs
    DomainPortOut:                       # Repository interfaces
      - DomainCore                       # Repositories return Domain models/VOs
      - SharedDomain                     # Can use shared domain concepts
      - SharedPaginationDomain           # Can use pagination VOs
      - SharedSearchDomain               # Can use search VOs

    DomainCore:                         # Domain models, VOs, events
      - SharedDomain                    # Can use shared concepts (AggregateRoot, etc.)
      - SharedPaginationDomain          # Can use pagination VOs
      - SharedSearchDomain              # Can use search VOs
      - DomainPortOut                   # Domain can reference Port OUT interfaces

    # APPLICATION LAYER - Use Cases
    Application:
      - DomainCore                      # Depends on Domain models, VOs
      - DomainPortIn                    # Implements Port IN interfaces
      - DomainPortOut                   # Uses Port OUT interfaces (repositories)
      - SharedDomain                    # Uses shared concepts
      - SharedPaginationDomain          # Uses pagination VOs in queries
      - SharedSearchDomain              # Uses search VOs in queries

    # ADAPTER IN (Driving) - Entry Points
    AdapterIn:
      - Application                     # Calls Application layer (Commands, Queries)
      - DomainCore                      # Can use Domain VOs for request validation
      - DomainPortIn                    # Can reference Port IN (for documentation)
      - SharedAdapterOut                # Can use shared validators

    # ADAPTER OUT (Driven) - Technical Implementations
    AdapterOut:
      - DomainCore                      # Implements Domain repositories
      - DomainPortOut                   # Implements Port OUT interfaces
      - SharedDomain                    # Uses shared domain concepts
      - SharedPaginationDomain          # Uses pagination VOs
      - SharedSearchDomain              # Uses search VOs
      - SharedAdapterOut                # Uses shared infrastructure

    # SYMFONY LAYER - Framework Integration
    Symfony:
      - DomainCore                      # DataFixtures need Domain models
      - Application                     # Controllers use Application layer
      - AdapterIn                       # Can wire adapters
      - AdapterOut                      # Can wire adapters
      - SharedDomain                    # Uses shared domain
      - SharedAdapterOut                # Uses shared infrastructure

  formatters:
    graphviz:
      groups:
        Domain:
          - DomainCore
          - DomainPortIn
          - DomainPortOut
        Application:
          - Application
        Adapters:
          - AdapterIn
          - AdapterOut
        Shared:
          - SharedDomain
          - SharedPaginationDomain
          - SharedSearchDomain
          - SharedAdapterOut
        Framework:
          - Symfony
