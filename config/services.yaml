parameters: null
services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\:
        resource: ../src/
        exclude:
            - ../src/DependencyInjection/
            - ../src/Entity/
            - ../src/Kernel.php
            - ../src/Gift/Attribution/Domain/Model/
            - ../src/Gift/Attribution/Domain/ValueObject/
            - ../src/Security/User/Domain/Model/
            - ../src/Security/User/Domain/ValueObject/
    App\Gift\Attribution\Infrastructure\Adapter\In\Web\Controller\ListResidentsController:
        arguments:
            $queryBus: '@query.bus'

    # Port → Adapter bindings (Hexagonal Architecture)
    # These bindings connect Domain ports (interfaces) to Infrastructure adapters (implementations)

    # Command Bus Port (Shared)
    App\Shared\Domain\Port\Out\CommandBusInterface:
        class: App\Shared\Infrastructure\Adapter\Out\Bus\MessengerCommandBus
        arguments:
            $commandBus: '@command.bus'

    # Query Bus Port (Shared)
    App\Shared\Domain\Port\Out\QueryBusInterface:
        class: App\Shared\Infrastructure\Adapter\Out\Bus\MessengerQueryBus
        arguments:
            $queryBus: '@query.bus'

    # ID Generation Port (Shared)
    App\Shared\Domain\Port\Out\IdGeneratorInterface:
        class: App\Shared\Infrastructure\Adapter\Out\Generator\UuidV7Generator
        # Using UUID v7 (time-ordered, better for database performance)
        # Can be swapped for:
        # - UlidGenerator (lexicographically sortable)
        # - SnowflakeGenerator (distributed systems)
        # - FakeIdGenerator (deterministic testing)

    # Domain Event Publisher Port (Shared)
    App\Shared\Domain\Port\Out\DomainEventPublisherInterface:
        class: App\Shared\Infrastructure\Adapter\Out\Event\SymfonyDomainEventPublisher
        arguments:
            $symfonyEventDispatcher: '@event_dispatcher'
            $eventStore: '@App\Shared\Domain\Port\Out\EventStoreInterface'
            $logger: '@logger'
        # Adapter that publishes domain events via:
        #    1. EventStore (audit trail, event sourcing)
        #    2. Symfony EventDispatcher (side effects: email, notifications)
        # This allows:
        # - Automatic EventStore persistence for ALL domain events
        # - Domain/Application layers remain framework-agnostic
        # - EventSubscribers in Infrastructure can react to domain events
        # - Easy testing with FakeDomainEventPublisher + InMemoryEventStore

    # EventStore Port (Shared)
    App\Shared\Domain\Port\Out\EventStoreInterface:
        class: App\Shared\Infrastructure\Adapter\Out\Persistence\Doctrine\DoctrineEventStore
        # Persists domain events in database for:
        #    - Audit trail (complete business operations history)
        #    - Event replay (reconstruct aggregate state)
        #    - Analytics (query historical events)
        #    - Debugging (trace application behavior)

    # Repository Ports
    App\Gift\Attribution\Domain\Port\Out\ResidentRepositoryInterface:
        class: App\Gift\Attribution\Infrastructure\Adapter\Out\Persistence\Doctrine\DoctrineResidentRepository
    App\Gift\Attribution\Domain\Port\Out\GiftRepositoryInterface:
        class: App\Gift\Attribution\Infrastructure\Adapter\Out\Persistence\Doctrine\DoctrineGiftRepository
    App\Gift\Attribution\Domain\Port\Out\GiftAttributionRepositoryInterface:
        class: App\Gift\Attribution\Infrastructure\Adapter\Out\Persistence\Doctrine\DoctrineGiftAttributionRepository
    App\Gift\Request\Domain\Port\Out\GiftRequestRepositoryInterface:
        class: App\Gift\Request\Infrastructure\Adapter\Out\Persistence\Doctrine\DoctrineGiftRequestRepository

    # Validation Port Implementations
    # Note: AttributeGiftCommand uses Value Objects for self-validation
    # Note: SubmitGiftRequestCommand uses ValidationMiddleware for Symfony Validator

    # Messenger Middleware - Validation (Infrastructure)
    validation:
        class: App\Shared\Infrastructure\Adapter\Out\Messenger\Middleware\ValidationMiddleware
        arguments:
            $validator: '@validator'
        tags:
            - { name: 'messenger.middleware' }

    # Custom Validators (Infrastructure)
    # These validators delegate to Domain logic (no duplication of business rules)
    App\Shared\Infrastructure\Adapter\Out\Validator\Constraint\GiftAvailableValidator:
        arguments:
            $giftRepository: '@App\Gift\Attribution\Domain\Port\Out\GiftRepositoryInterface'
        tags:
            - { name: 'validator.constraint_validator' }

    # Doctrine Listener (Infrastructure - auto-publishes domain events)
    App\Shared\Infrastructure\Adapter\Out\Persistence\Doctrine\DomainEventPublisherListener:
        arguments:
            $eventPublisher: '@App\Shared\Domain\Port\Out\DomainEventPublisherInterface'
        tags:
            - { name: doctrine.event_listener, event: postFlush }
        # Automatically pulls events from aggregates after successful flush
        #    and publishes them via DomainEventPublisherInterface

    # EventSubscribers (Infrastructure layer - reacts to Domain events)
    App\Gift\Request\Infrastructure\Adapter\Out\EventSubscriber\GiftRequestSubmittedSubscriber:
        tags:
            - { name: kernel.event_subscriber }
        # Reacts to GiftRequestSubmitted event to send confirmation email

    App\Gift\Attribution\Infrastructure\Adapter\Out\EventSubscriber\GiftAttributedSubscriber:
        arguments:
            $messageBus: '@messenger.default_bus'
        tags:
            - { name: kernel.event_subscriber }
        # Reacts to GiftAttributed event:
        #    - Sends confirmation email (sync)
        #    - Dispatches PDF generation to Messenger queue (async)

    # Kernel Event Listeners (Infrastructure - cross-cutting concerns)
    App\Shared\Infrastructure\Adapter\Out\Http\EventListener\RequestIdListener:
        # Automatically registered via AsEventListener attribute
        # Adds correlation ID to all HTTP requests for tracing

    # ========================================
    # JWT Authentication (Security bounded context)
    # ========================================

    # User Repository Port
    App\Security\User\Domain\Port\Out\UserRepositoryInterface:
        class: App\Security\User\Infrastructure\Adapter\Out\Persistence\Doctrine\DoctrineUserRepository

    # Password Hasher Port
    App\Security\User\Domain\Port\Out\PasswordHasherInterface:
        class: App\Security\User\Infrastructure\Adapter\Out\Security\SymfonyPasswordHasher
        arguments:
            $hasherFactory: '@security.password_hasher_factory'

    # JWT Token Generator Port
    App\Security\Authentication\Domain\Port\Out\TokenGeneratorInterface:
        class: App\Security\Authentication\Infrastructure\Adapter\Out\Jwt\FirebaseJwtTokenGenerator
        arguments:
            $secret: '%env(JWT_SECRET)%'
            $issuer: '%env(JWT_ISSUER)%'
            $ttl: 3600  # 1 hour

    # JWT Authenticator (Symfony Security integration)
    App\Security\Authentication\Infrastructure\Adapter\Out\Security\JwtAuthenticator:
        arguments:
            $tokenGenerator: '@App\Security\Authentication\Domain\Port\Out\TokenGeneratorInterface'
            $userRepository: '@App\Security\User\Domain\Port\Out\UserRepositoryInterface'

    # User Registered Event Subscriber
    App\Security\User\Infrastructure\Adapter\Out\EventSubscriber\UserRegisteredSubscriber:
        tags:
            - { name: kernel.event_subscriber }
